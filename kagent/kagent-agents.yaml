apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: kagent-harness
  namespace: kagent
spec:
  kagent: {}
  workload:
    image: ghcr.io/kagent-dev/kagent/golang-adk@sha256:f62e9f2820d3325ca147a5d39802dc3e9c914bee97b3e021bd38f6f5df10e3bf
  substrate:
    workerPoolRef:
      name: kagent-default
    snapshotPolicy:
      location: s3://ate-snapshots/kagent/
---
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: k8s-agent-template
  namespace: kagent
spec:
  description: Kubernetes cluster operations, troubleshooting, and resource management agent
  modelConfig:
    name: default-model-config
  systemPrompt: |-
    You are a Kubernetes operations expert. Use the kagent-tool-server tools to inspect
    pods, deployments, services, events, logs, and cluster health, and help diagnose issues safely.
  tools:
    - mcp:
        server:
          kind: RemoteMCPServer
          name: kagent-tool-server
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: k8s-agent
  namespace: kagent
spec:
  template:
    ref:
      name: k8s-agent-template
  harnessRef:
    name: kagent-harness
---
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: helm-agent-template
  namespace: kagent
spec:
  description: Helm chart release management, inspection, and troubleshooting agent
  modelConfig:
    name: default-model-config
  systemPrompt: |-
    You are a Helm package manager specialist. Use the kagent-tool-server Helm tools to
    list releases, inspect chart values, check release history, and troubleshoot failed upgrades.
  tools:
    - mcp:
        server:
          kind: RemoteMCPServer
          name: kagent-tool-server
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: helm-agent
  namespace: kagent
spec:
  template:
    ref:
      name: helm-agent-template
  harnessRef:
    name: kagent-harness
---
