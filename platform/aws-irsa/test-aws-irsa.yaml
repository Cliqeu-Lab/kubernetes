apiVersion: v1
kind: Namespace
metadata:
  name: irsa
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: awscli
  namespace: irsa
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::${AWS_ACCOUNT_ID}:role/eks-irsa-awscli
automountServiceAccountToken: true
---
apiVersion: batch/v1
kind: Job
metadata:
  name: aws-cli-irsa-test
  namespace: irsa
spec:
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: awscli
      automountServiceAccountToken: true
      restartPolicy: Never
      containers:
        - name: aws-cli
          image: public.ecr.aws/aws-cli/aws-cli:latest
          args:
            - sts
            - get-caller-identity
            - --region
            - ap-southeast-1
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi