---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opentelemetry-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Cliqeu-Lab/opentelemetry-helm-charts
    targetRevision: main
    path: charts/opentelemetry-demo
    helm:
      releaseName: opentelemetry-demo
      values: |
        opentelemetry-collector:
          enabled: true
          mode: daemonset
          presets:
            hostMetrics:
              enabled: true
            kubeletMetrics:
              enabled: true
            clusterMetrics:
              enabled: true
            kubernetesAttributes:
              enabled: true
            logsCollection:
              enabled: true
            kubernetesObjects:
              enabled: true
              watch: true
              events:
                enabled: true
            annotationDiscovery:
              metrics:
                enabled: true

        components:
          # ad:
          #   envOverrides:
          #     - name: OTEL_EXPORTER_OTLP_PROTOCOL
          #       value: http/protobuf
          frontend:
            envOverrides:
              - name: PUBLIC_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
                value: /otlp-http/v1/traces
          frontend-proxy:
            service:
              type: LoadBalancer
  destination:
    server: https://kubernetes.default.svc
    namespace: opentelemetry-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
